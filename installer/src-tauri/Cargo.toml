[package]
name = "spiritagent-bootstrap"
version = "1.2.0"
description = "唤生 安装器 —— 由 installer/install.ps1 与 installer/install.sh 驱动桌面端安装"
authors = ["唤生 <yjm1062@gmail.com>"]
edition = "2021"
rust-version = "1.77"

# 输出二进制名即分发物名 `SpiritAgent-Setup.exe`；Tauri 以 [[bin]] 名为准，不使用 [package].name。
[[bin]]
name = "SpiritAgent-Setup"
path = "src/main.rs"

# 库目标供 main.rs 调用并承载单元测试。
[lib]
name = "spiritagent_bootstrap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 把 ../payload/ 打包成单 zip 嵌入 SpiritAgent-Setup.exe；运行时由 embedded_payload 解压到 SPIRITAGENT_HOME。
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

dirs = "5"
which = "6"
anyhow = "1"
# 解压 build.rs 嵌入的 payload zip。
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
