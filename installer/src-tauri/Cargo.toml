[package]
name = "spiritagent-bootstrap"
version = "0.4.0"
description = "SpiritAgent Setup — signed installer that drives installer/install.ps1"
authors = ["SpiritAgent <info@spiritagent.ai>"]
edition = "2021"
rust-version = "1.77"

# Rename the output binary so the distributed artifact is literally
# `SpiritAgent-Setup.exe` on disk — not `spiritagent-bootstrap.exe`. Grandma sees
# what we hand her, period. Tauri honors [[bin]] over [package].name
# for the produced executable name.
[[bin]]
name = "SpiritAgent-Setup"
path = "src/main.rs"

# The library target name MUST match the `withGlobalTauri` binding name that
# tauri.conf.json's `app.windows[].label` references. We don't ship a separate
# lib for now; everything is in src/.
[lib]
name = "spiritagent_bootstrap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 把 ../payload/ 打包成单 zip 嵌入 SpiritAgent-Setup.exe，使分发只需一个二进制；运行时由 embedded_payload 解压到 SPIRITAGENT_HOME。
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dependencies]
# Tauri runtime + plugins
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"

# Async + IO
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging — emitted to a file under SPIRITAGENT_HOME/logs/ and (optionally) the
# webview console via Tauri's event channel.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Paths + utils
dirs = "5"
which = "6"
anyhow = "1"
thiserror = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
# 解压 build.rs 嵌入的 payload zip；与 build-dependencies 同版本但 default-features 不同（这里需要 std 解压能力）。
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# Process control on Windows (CREATE_NO_WINDOW etc.)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# A 5-10MB signed installer is the goal. LTO + size-opt + single codegen unit.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
