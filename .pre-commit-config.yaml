repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # 先修复导入与代码检查问题，再由格式器统一样式。
      - id: ruff-check
        args: [ --fix ]
        exclude: ^(installer)/
      - id: ruff-format
        exclude: ^(installer)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        # --fix=lf：默认 auto 会保留纯 CRLF 文件，与仓库统一 LF 不符。
        args: ['--fix=lf']
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # README 的完整实机演示；其余文件仍按 1000 KB 检查。
        exclude: ^docs/media/demo\.mp4$
      - id: check-json
        types: [ file ]
        files: \.(json|myext)$
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: check-imports
        name: check backend+runner import shape (future annotations, TYPE_CHECKING leak, facade consistency)
        # --strict-imports 让违规直接失败；不加则只打印诊断并 exit 0（advisory 模式）。
        entry: python scripts/check_imports.py --strict-imports
        language: system
        types: [python]
        files: ^(backend|runner)/
      - id: check-runner-architecture
        name: check Runner dependencies and resource ownership
        entry: python scripts/check_runner_architecture.py
        language: system
        files: ^(runner/|scripts/check_runner_architecture\.py$)
        pass_filenames: false
      - id: check-forbidden-comments
        name: check forbidden issue tags in code comments
        entry: '(?i)#\s*.*(P[0-9]+-[0-9]+|M-[0-9]+)'
        language: pygrep
        types: [python, ts, tsx, javascript]
        exclude: ^(RULES\.md|AGENTS\.md|CHANGELOG.*|\.git.*)
      - id: client-eslint-fix
        name: client eslint fix
        entry: pnpm --dir client exec eslint renderer/ main/ shared/ scripts/ --fix
        language: system
        files: ^client/(renderer|main|shared|scripts)/.*\.(ts|tsx|js|cjs|mjs)$
        pass_filenames: false
      - id: client-fmt
        name: client prettier format
        entry: pnpm --dir client exec prettier --write "renderer/**/*.{ts,tsx}" "main/**/*.{ts,tsx}" "shared/**/*.{ts,tsx}" "scripts/**/*.{cjs,mjs,ts}"
        language: system
        files: ^client/.*\.(ts|tsx|js|cjs|mjs|json|css)$
        pass_filenames: false
      - id: remote-eslint-fix
        name: remote eslint fix
        entry: node remote/node_modules/eslint/bin/eslint.js --config remote/eslint.config.mjs remote shared --fix
        language: system
        files: ^(remote|shared)/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false
      - id: remote-fmt
        name: remote prettier format
        entry: pnpm --dir remote exec prettier --config .prettierrc --write "*.{ts,tsx,css,html,mjs,json}" "../shared/!(*.generated).ts"
        language: system
        files: ^(remote|shared)/.*\.(ts|tsx|js|mjs|json|css|html)$
        pass_filenames: false
