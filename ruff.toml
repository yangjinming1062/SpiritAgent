# 项目级 Ruff 配置，供 pre-commit、CLI 与 IDE 共用。

line-length = 120
target-version = "py313"
extend-exclude = [
    "installer",
    "client",
    ".ruff_cache",
]

[lint]
# 尾逗号与换行由格式器管理。
select = [
    "E", "F", "I", "SIM", "C4", "UP", "FA", "ARG", "PLC", "ERA",
]
ignore = [
    "PLC0415",  # 非 import 顶层 import（provider 注册需要副作用）
    "ARG001",   # FastAPI 依赖项未使用参数
    "ARG002",   # FastAPI 路由 handler 未使用参数
    "E501",     # 部分字符串不处理换行（如正则、JSON、SQL、prompt 模板），不强制折行
]

[format]
# 行尾钉死 LF；默认 "auto" 沿用文件现有行尾，Windows 上会保留 CRLF。
line-ending = "lf"
