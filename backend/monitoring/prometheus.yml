global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "spiritagent-backend"
    metrics_path: "/metrics"
    # 令牌文件由 docker-compose.yml 注入（见其 configs.metrics_auth_token）；为空时发送空 Bearer，后端未设令牌则忽略。
    authorization:
      credentials_file: /etc/prometheus/metrics_auth_token
    static_configs:
      - targets: ["backend:10620"]
