services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spiritagent-postgres
    restart: unless-stopped
    environment: &postgres_credentials
      POSTGRES_USER: ${POSTGRES_USER:?请在 backend/.env 设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 backend/.env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 backend/.env 设置 POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: spiritagent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment: *postgres_credentials
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 仅绑定本机回环：明文 HTTP 不暴露公网，公网 TLS 由 caddy（--profile public）终止。
    ports:
      - "127.0.0.1:10620:10620"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./updates:/app/updates
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://localhost:10620/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 公网 HTTPS 入口（--profile public）：需先按 Caddyfile.example 准备 Caddyfile。
  caddy:
    image: caddy:2
    container_name: spiritagent-caddy
    restart: unless-stopped
    profiles:
      - public
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
