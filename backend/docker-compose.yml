services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spiritagent-postgres
    restart: unless-stopped
    environment: &postgres_credentials
      POSTGRES_USER: ${POSTGRES_USER:?请在 backend/.env 设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 backend/.env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 backend/.env 设置 POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 5

  # 服务更新器：管理后台「服务更新」页的执行体，随默认 Compose 一起启动。
  updater:
    build:
      context: ..
      dockerfile: backend/updater/Dockerfile
    container_name: spiritagent-updater
    restart: unless-stopped
    environment:
      REPO_DIR: ${UPDATER_REPO_DIR:-/srv/spiritagent}
    volumes:
      # Docker socket：执行构建与重启。
      - /var/run/docker.sock:/var/run/docker.sock
      # 仓库按宿主机绝对路径挂载，保留属主；git 检出与 compose 相对目录都指向原部署。
      - ${UPDATER_REPO_DIR:-/srv/spiritagent}:${UPDATER_REPO_DIR:-/srv/spiritagent}
      # 状态与任务日志持久卷。
      - updater_state:/var/lib/spiritagent-updater
      - updater_socket:/run/updater

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: spiritagent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *postgres_credentials
      XHS_MCP_BASE_URL: ${XHS_MCP_BASE_URL:-http://xiaohongshu-mcp:18060}
      # 更新器共享 socket 目录；updater 未运行时为空目录，页面按未接入处理。
      SERVICE_UPDATER_SOCKET_DIR: /run/updater
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 仅绑定本机回环：明文 HTTP 不暴露公网，公网 TLS 由 caddy（--profile public）终止。
    ports:
      - "127.0.0.1:10620:10620"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./updates:/app/updates
      - ./data:/app/data
      # 与更新器容器共享同一 socket 卷。
      - updater_socket:/run/updater
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://localhost:10620/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 公网 HTTPS 入口（--profile public）：需先按 Caddyfile.example 准备 Caddyfile。
  caddy:
    image: caddy:2
    container_name: spiritagent-caddy
    restart: unless-stopped
    profiles:
      - public
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # 小红书采集服务随 Backend 一起启动；首次扫码登录由运营者完成。
  xiaohongshu-mcp:
    build:
      context: ./infrastructure/web/xiaohongshu_service
      args:
        GOPROXY: ${XHS_BUILD_GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${XHS_BUILD_GOSUMDB:-sum.golang.google.cn}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      COOKIES_PATH: /app/data/cookies.json
      HOME: /app/data/home
      XDG_CONFIG_HOME: /app/data/config
      AUTH_TOKEN: ${XHS_MCP_AUTH_TOKEN:-}
      XHS_PROXY: ${XHS_PROXY:-}
    ports:
      - "127.0.0.1:18060:18060"
    volumes:
      - xiaohongshu_data:/app/data
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:18060/health"]
      interval: 30s
      timeout: 6s
      retries: 3

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  xiaohongshu_data:
  updater_state:
  updater_socket:
