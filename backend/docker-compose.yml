services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spiritagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spiritagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: spiritagent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    ports:
      - "10620:10620"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./updates:/app/updates
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:10620/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional Prometheus metrics observability platform (--profile monitoring)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: spiritagent-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
